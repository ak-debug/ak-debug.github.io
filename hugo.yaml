baseURL: https://ak-debug.github.io/
locale: en-us
title: Akshit Kathuria
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pygmentsUseClasses: true

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Akshit Kathuria
  description: "Security writeups, CTF solutions, and notes on offensive security and malware analysis."
  images: ["social-preview.png"]
  keywords: [security, infosec, CTF, writeups, malware analysis, web security]
  author: Akshit Kathuria
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: true
  disableSpecial1stPost: false

  homeInfoParams:
    Title: "Akshit Kathuria"
    Content: >
      Security enthusiast focused on offensive security, web exploitation, and malware analysis.
      This is where I write up the labs, CTF challenges, and hands-on experiments I work through.

  socialIcons:
    - name: github
      url: "https://github.com/ak-debug"

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"

markup:
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true
    guessSyntax: true

menu:
  main:
    - identifier: posts
      name: Writeups
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
